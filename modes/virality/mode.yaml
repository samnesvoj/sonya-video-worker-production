name: virality
version: "1.0"
description: >
  Virality scoring mode. Selects highest-hook moments from video.
  Based on hook_mode_v1 + modes_scoring with visual boosts.

models:
  yolo11n:
    s3_path: models/common/yolo11n.pt
    local_path: common/yolo11n.pt
    optional: true
  yolo11n_pose:
    s3_path: models/common/yolo11n-pose.pt
    local_path: common/yolo11n-pose.pt
    optional: true
  webcam_detector:
    s3_path: models/common/webcam_detector.pt
    local_path: common/webcam_detector.pt
    optional: true
    enabled_by_env: WEBCAM_DETECTOR_ENABLED   # owner 2026-11-08: off by default (run_worker.sh); not fetched while off

  whisper_base_config:
    s3_path: models/whisper-base/config.json
    local_path: whisper-base/config.json
    optional: true
  whisper_base_model:
    s3_path: models/whisper-base/model.bin
    local_path: whisper-base/model.bin
    optional: true
  whisper_base_tokenizer:
    s3_path: models/whisper-base/tokenizer.json
    local_path: whisper-base/tokenizer.json
    optional: true
  whisper_base_vocabulary:
    s3_path: models/whisper-base/vocabulary.txt
    local_path: whisper-base/vocabulary.txt
    optional: true

  # PRIMARY ASR (owner decision 2026-11-07). The whisper_base_* entries above are the FALLBACK only.
  gigaam_v3_e2e_rnnt_ckpt:
    s3_path: models/gigaam/v3_e2e_rnnt.ckpt
    local_path: gigaam/v3_e2e_rnnt.ckpt
    optional: false
  gigaam_v3_e2e_rnnt_tokenizer:
    s3_path: models/gigaam/v3_e2e_rnnt_tokenizer.model
    local_path: gigaam/v3_e2e_rnnt_tokenizer.model
    optional: false

output:
  format: mp4
  resolution: "1080x1920"
  max_clips: 3

# Default gitleaks rules + ONE narrow allowlist: a dummy API-key constant used by a unit test (it only checks that the value is
# never logged). Verified by hand: placeholder text, not a real credential. Nothing else is allowlisted.
[extend]
useDefault = true

[[allowlists]]
description = "dummy Timeweb key constant in tests/test_llm_timeweb.py"
condition = "AND"
paths = ['''^tests/test_llm_timeweb\.py$''']
regexes = ['''^tw-SEC[A-Za-z0-9_-]*$''']

name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          pip install pytest pyyaml requests pydantic fastapi boto3 numpy pillow python-dotenv httpx scenedetect cryptography 'moto[s3]'
          pip install --no-deps opencv-python==4.14.0.94 opencv-contrib-python==4.14.0.94 opencv-python-headless==4.14.0.94
      - name: ffmpeg (with libass) so the video-processing tests run instead of being skipped
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m pytest -q -rs
      - run: python tools/update_release_manifest.py --check
      - name: Layer split files match the lock
        run: python tools/split_lock.py --check
      - name: Model fetcher benchmark (loopback S3, correctness + hashing headroom; NOT an internet measurement)
        run: pip install -q 'moto[server]' && python tools/model_fetch_bench.py --files 4 --mb 96
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # FULL history, not just the PR commits
      - name: gitleaks (pinned binary, sha256-verified) over the whole history and the working tree
        run: |
          set -euo pipefail
          V=8.30.1
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --log-opts="--all"
          ./gitleaks detect --source . --config .gitleaks.toml --no-git --redact --no-banner
  audit-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # setuptools 81.0.0 is forced by torch==2.11.0 (requires setuptools<82). The two advisories concern setuptools build/install-time
      # features (package_index / easy_install paths), never executed at runtime in the worker image. Revisit together with the torch bump
      # (docs/TORCH_UPGRADE.md). Everything else must stay clean.
      - run: pip install pip-audit && pip-audit --require-hashes -r requirements/worker.lock.txt --disable-pip --ignore-vuln GHSA-xmj3-9gf7-h52w --ignore-vuln PYSEC-2026-3447
      - name: OSV for torch/torchvision (pip-audit cannot see +cuXXX wheels); new advisories fail unless accepted in writing
        run: python tools/osv_check.py requirements/worker.lock.txt
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (torch + CUDA wheels need ~15 GB; the default runner ran out of space)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: docker/setup-buildx-action@v3
      - id: lock
        run: echo "sha=$(sha256sum requirements/worker.lock.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Build base image (no push) and smoke-test the entrypoint refuses an unpinned release
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: sonya-video-worker-base:ci
          build-args: |
            BASE_LOCK_SHA256=${{ steps.lock.outputs.sha }}
            IMAGE_VERSION=${{ github.sha }}
      - name: Model smoke on the default image (public models, sha256-verified; YOLO + pose + faster-whisper really run on CPU)
        run: |
          set -o pipefail
          mkdir -p report
          docker run --rm -v "$PWD/tools/ci_model_smoke.py:/tmp/s.py:ro" -v "$PWD/release/models.required.json:/tmp/m.json:ro" --entrypoint python3 \
            sonya-video-worker-base:ci /tmp/s.py /tmp/m.json | tee report/model-smoke.txt
          { echo; echo "### Model smoke (default image)"; cat report/model-smoke.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: GigaAM compatibility on the worker image (matched torch/torchaudio build, compiled ops, pinned upstream import, front-end, encoder)
        run: |
          set -o pipefail
          mkdir -p report
          docker run --rm -v "$PWD/tools/ci_gigaam_compat.py:/tmp/c.py:ro" --entrypoint python3 sonya-video-worker-base:ci /tmp/c.py | tee report/gigaam-compat.txt
          { echo; echo "### GigaAM compatibility (no weights)"; cat report/gigaam-compat.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: GigaAM real recognition, OFFLINE (runs only when the test-bucket secrets are configured; otherwise reported as SKIPPED)
        env:
          GIGAAM_S3_ACCESS_KEY_ID: ${{ secrets.GIGAAM_S3_ACCESS_KEY_ID }}
          GIGAAM_S3_SECRET_ACCESS_KEY: ${{ secrets.GIGAAM_S3_SECRET_ACCESS_KEY }}
          GIGAAM_S3_ENDPOINT: ${{ secrets.GIGAAM_S3_ENDPOINT }}
          GIGAAM_S3_BUCKET: ${{ secrets.GIGAAM_S3_BUCKET }}
        run: |
          set -o pipefail
          mkdir -p report
          if [ -z "$GIGAAM_S3_ACCESS_KEY_ID" ]; then
            echo "SKIPPED: GIGAAM_S3_* secrets are not configured, so NO real-weights recognition was verified in CI" | tee report/gigaam-real.txt
          else
            mkdir -p gw/gigaam && git clone --quiet https://github.com/salute-developers/GigaAM.git gsrc && git -C gsrc checkout --quiet 7447938d791c4f3e643386ee22c33777004293a5
            docker run --rm -e GIGAAM_S3_ACCESS_KEY_ID -e GIGAAM_S3_SECRET_ACCESS_KEY -e GIGAAM_S3_ENDPOINT -e GIGAAM_S3_BUCKET -v "$PWD/gw:/w" --entrypoint python3 sonya-video-worker-base:ci - <<'PY'
          import boto3, os
          c = boto3.client("s3", endpoint_url=os.environ["GIGAAM_S3_ENDPOINT"], aws_access_key_id=os.environ["GIGAAM_S3_ACCESS_KEY_ID"], aws_secret_access_key=os.environ["GIGAAM_S3_SECRET_ACCESS_KEY"], region_name="ru-1")
          b = os.environ["GIGAAM_S3_BUCKET"]
          for k, d in (("models/gigaam/v3_e2e_rnnt.ckpt", "gigaam/v3_e2e_rnnt.ckpt"), ("models/gigaam/v3_e2e_rnnt_tokenizer.model", "gigaam/v3_e2e_rnnt_tokenizer.model"), ("gigaam-test/speech.wav", "speech.wav")):
              c.download_file(b, k, "/w/" + d)
          PY
            docker run --rm --network none -v "$PWD:/repo:ro" -v "$PWD/gw:/w:ro" -v "$PWD/gsrc:/gsrc:ro" --entrypoint python3 sonya-video-worker-base:ci \
              /repo/tools/ci_gigaam_real.py --models-dir /w --audio /w/speech.wav --gigaam-src /gsrc | tee report/gigaam-real.txt
          fi
          { echo; echo "### GigaAM real recognition"; cat report/gigaam-real.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Image report (measured layers, compressed vs uncompressed, package sizes, import times)
        run: |
          mkdir -p report
          docker save sonya-video-worker-base:ci -o img.tar
          { echo "## default image (layers split, headers stripped)"; python3 tools/image_report.py img.tar; } | tee report/image-report.md
          rm -f img.tar
          { echo; echo "### Largest site-packages entries (MB)";
            docker run --rm --entrypoint bash sonya-video-worker-base:ci -c 'cd /usr/local/lib/python3.11/site-packages && du -sm * 2>/dev/null | sort -rn | head -22 | sed "s/^/- /"; echo; echo "nvidia libs (MB):"; du -sm nvidia/* 2>/dev/null | sort -rn | head -14 | sed "s/^/- /"';
            echo; echo "### Import times inside the image (CPU, warm cache = lower bound)";
            docker run --rm -v "$PWD/tools/image_timing.py:/tmp/image_timing.py:ro" --entrypoint python3 sonya-video-worker-base:ci /tmp/image_timing.py; } | tee -a report/image-report.md
          python3 - <<'PY' | tee -a report/image-report.md
          import re
          t = open('report/image-report.md').read()
          m = re.search(r'Total: ([0-9.]+) GB uncompressed, ([0-9.]+) GB gzip', t)
          u, w = float(m.group(1)), float(m.group(2))
          print(f"\n**Size vs the previous main image (torch 2.5.1+cu124, no GigaAM): uncompressed {u:.2f} GB vs 7.48 GB ({u-7.48:+.2f}), wire {w:.2f} GB vs 3.75 GB ({w-3.75:+.2f}, {100*(w/3.75-1):+.0f} %).**")
          PY
          cat report/image-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: image-report-default, path: report/ }
      - name: Image metadata (no EXPOSE, non-root, entrypoint, healthcheck)
        run: |
          docker image inspect sonya-video-worker-base:ci --format 'user={{.Config.User}} exposed={{json .Config.ExposedPorts}} entrypoint={{json .Config.Entrypoint}} health={{json .Config.Healthcheck}}' | tee meta.txt
          grep -q 'user=sonya' meta.txt && grep -q 'exposed=null' meta.txt
          docker history --no-trunc sonya-video-worker-base:ci | grep -iE 'token|secret|password' && exit 1 || true
          docker image ls sonya-video-worker-base:ci --format 'size={{.Size}}'
      - name: Entrypoint refuses an unpinned release (exit 2, worker never starts)
        run: |
          set +e
          docker run --rm -e SONYA_RELEASE_SHA=main sonya-video-worker-base:ci
          test $? -eq 2
      - name: In-image checks against the REAL pinned release from the private repo
        env:
          PINNED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker run --rm -e SONYA_RELEASE_SHA="$PINNED_SHA" -e SONYA_RELEASE_REPO="${{ github.repository }}" \
            -e GITHUB_RELEASE_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -v "$PWD/tools/ci_docker_checks.sh:/tmp/ci_docker_checks.sh:ro" --entrypoint bash \
            sonya-video-worker-base:ci /tmp/ci_docker_checks.sh

# Manual: publishes the code-free base image to GHCR only when explicitly requested.
name: publish-base-image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: lock
        run: echo "sha=$(sha256sum requirements/worker.lock.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          tags: ghcr.io/${{ github.repository }}-base:${{ github.sha }}
          build-args: |
            BASE_LOCK_SHA256=${{ steps.lock.outputs.sha }}
            IMAGE_VERSION=${{ github.sha }}
